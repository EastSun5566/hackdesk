name: Quality and package smoke

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run check:ci
      - run: xvfb-run --auto-servernum pnpm run test:smoke
      - run: pnpm run docs:build
      - run: pnpm run audit:prod
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  package-smoke:
    timeout-minutes: 45
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec vitest run electron/src/main/local-vault-service.test.ts electron/src/main/settings.test.ts electron/src/main/renderer-url.test.ts scripts/electron-build.test.ts scripts/electron-dev.test.ts scripts/electron-bundle.test.ts scripts/third-party-notices.test.ts scripts/check-packaged-contents.test.ts
      - run: pnpm run package:check
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Fails the build with the reason instead of only the packaged-contents check.
          HACKDESK_REQUIRE_SPEECH_HELPER: ${{ matrix.os == 'macos-latest' && '1' || '' }}
      - name: Test Windows signing and installation without SignPath credentials
        if: matrix.os == 'windows-latest'
        timeout-minutes: 15
        shell: pwsh
        run: ./scripts/test-signpath-verification.ps1 -UnsignedPath release/electron/win-unpacked/HackDesk.exe -IncludeInstaller
      # Launch the packaged binary that package:check just produced and
      # assert the first window loads the packaged renderer (hackdesk://...)
      # rather than a dev-server URL (http://localhost:5173). The spec sets
      # HACKDESK_ELECTRON_DEV_SERVER_URL explicitly and asserts the packaged
      # app ignores it because app.isPackaged is true.
      #
      # The spec uses child_process.spawn + chromium.connectOverCDP because
      # Playwright's _electron.launch relies on --inspect=0, which the
      # EnableNodeCliInspectArguments fuse (verified by
      # scripts/check-electron-fuses.ts in package:check) disables.
      # playwright.config.ts `testIgnore` keeps this spec out of the
      # regular `pnpm run test:smoke` run.
      #
      # Linux needs a display; macOS and Windows runners have one.
      - name: Run packaged-startup spec
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum pnpm exec playwright test \
              --config electron/playwright.packaged.config.ts \
              electron/e2e/packaged-startup.spec.ts
          else
            pnpm exec playwright test \
              --config electron/playwright.packaged.config.ts \
              electron/e2e/packaged-startup.spec.ts
          fi
      - name: Check the bundled updater against a local feed
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum pnpm exec playwright test --config electron/playwright.config.ts electron/e2e/bundled-updater.spec.ts
          else
            pnpm exec playwright test --config electron/playwright.config.ts electron/e2e/bundled-updater.spec.ts
          fi
      - name: Upload packaged-startup Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packaged-startup-report-${{ matrix.os }}
          path: |
            playwright-report
            test-results
            ${{ runner.temp }}/signpath-installer-fixture-*/builder.*.log
            ${{ runner.temp }}/signpath-installer-fixture-*/**/*verification.json
          retention-days: 7

  # Run the macOS-only app-lifecycle spec on a macOS runner. The spec itself
  # self-skips on non-darwin via `test.skip(process.platform !== 'darwin', ...)`,
  # so the runner is scoped to macos-latest rather than a 3-OS matrix — running
  # it on ubuntu/windows would just spend runner minutes on a guaranteed skip.
  macos-lifecycle:
    timeout-minutes: 20
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Build the source app (the lifecycle spec launches Electron from source,
      # not the packaged binary, so no electron-builder step here).
      - run: pnpm run build
      # Run only the lifecycle spec to keep the job focused and the macOS
      # runner minutes tight. The spec skips itself on non-darwin.
      - name: Run app-lifecycle spec
        run: pnpm exec playwright test --config electron/playwright.config.ts electron/e2e/app-lifecycle.spec.ts
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-lifecycle-report
          path: |
            playwright-report
            test-results
          retention-days: 7
