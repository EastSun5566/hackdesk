name: Electron release

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    outputs:
      is_beta: ${{ steps.release-kind.outputs.is_beta }}
      channel: ${{ steps.release-kind.outputs.channel }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify release tag
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - name: Resolve release kind
        id: release-kind
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$version" =~ -beta(\.|$) ]]; then
            echo "is_beta=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_beta=false" >> "$GITHUB_OUTPUT"
          fi
          channel="latest"
          if [[ "$version" == *-* ]]; then
            channel="${version#*-}"
            channel="${channel%%.*}"
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - run: pnpm run check
      - run: xvfb-run --auto-servernum pnpm run test:smoke
      - run: pnpm run docs:build
      - run: pnpm run audit:prod

  build:
    timeout-minutes: 45
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --x64 --arm64
          - os: windows-latest
            args: --win --x64
          - os: ubuntu-latest
            args: --linux AppImage --x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify macOS signing secrets
        if: matrix.os == 'macos-latest' && needs.quality.outputs.is_beta != 'true'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for value in "$CSC_LINK" "$CSC_KEY_PASSWORD" "$APPLE_ID" "$APPLE_APP_SPECIFIC_PASSWORD" "$APPLE_TEAM_ID"; do
            if [[ -z "$value" ]]; then
              echo "::error::Required macOS signing or notarization secret is missing."
              exit 1
            fi
          done
      - name: Verify Windows signing secrets
        if: matrix.os == 'windows-latest' && needs.quality.outputs.is_beta != 'true'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [[ -z "$CSC_LINK" || -z "$CSC_KEY_PASSWORD" ]]; then
            echo "::error::Required Windows signing secret is missing."
            exit 1
          fi
      - run: pnpm run build
      - name: Build unsigned beta
        if: needs.quality.outputs.is_beta == 'true'
        shell: bash
        run: |
          read -r -a build_args <<< "$BUILD_ARGS"
          pnpm exec electron-builder "${build_args[@]}" --config.publish.channel="$RELEASE_CHANNEL" --config.mac.identity=null --config.mac.notarize=false --publish never
        env:
          BUILD_ARGS: ${{ matrix.args }}
          RELEASE_CHANNEL: ${{ needs.quality.outputs.channel }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Build signed RC or stable release
        if: needs.quality.outputs.is_beta != 'true'
        shell: bash
        run: |
          read -r -a build_args <<< "$BUILD_ARGS"
          pnpm exec electron-builder "${build_args[@]}" --config.publish.channel="$RELEASE_CHANNEL" --publish never
        env:
          BUILD_ARGS: ${{ matrix.args }}
          RELEASE_CHANNEL: ${{ needs.quality.outputs.channel }}
          CSC_LINK: ${{ matrix.os == 'windows-latest' && secrets.WIN_CSC_LINK || matrix.os == 'macos-latest' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'windows-latest' && secrets.WIN_CSC_KEY_PASSWORD || matrix.os == 'macos-latest' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ matrix.os }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
          path: |
            release/electron/*.dmg
            release/electron/*.zip
            release/electron/*.exe
            release/electron/*.AppImage
            release/electron/*.blockmap
            release/electron/${{ needs.quality.outputs.channel }}*.yml

  finalize:
    timeout-minutes: 15
    needs: [quality, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Validate assets and upload draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_CHANNEL: ${{ needs.quality.outputs.channel }}
        run: |
          version="$(node -p "require('./package.json').version")"
          expected_assets=(
            "HackDesk-$version-arm64.dmg"
            "HackDesk-$version-arm64.zip"
            "HackDesk-$version-x64.dmg"
            "HackDesk-$version-x64.zip"
            "HackDesk-$version-x64.exe"
            "HackDesk-$version-x86_64.AppImage"
            "$RELEASE_CHANNEL.yml"
            "$RELEASE_CHANNEL-mac.yml"
            "$RELEASE_CHANNEL-linux.yml"
          )
          for asset in "${expected_assets[@]}"; do
            if [[ ! -s "artifacts/$asset" ]]; then
              echo "::error::Missing or empty release asset: $asset"
              exit 1
            fi
          done
          for metadata in "artifacts/$RELEASE_CHANNEL"*.yml; do
            grep -Fqx "version: $version" "$metadata"
          done
          assets=(artifacts/*)
          for asset in "${assets[@]}"; do
            case "${asset#artifacts/}" in
              "HackDesk-$version-"*.dmg|"HackDesk-$version-"*.zip|"HackDesk-$version-"*.exe|"HackDesk-$version-"*.AppImage|"HackDesk-$version-"*.blockmap|"$RELEASE_CHANNEL.yml"|"$RELEASE_CHANNEL-mac.yml"|"$RELEASE_CHANNEL-linux.yml") ;;
              *) echo "::error::Unexpected release asset: $asset"; exit 1 ;;
            esac
            test -s "$asset"
          done

          state="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"' 2>/dev/null)" || state="missing"
          case "$state" in
            missing)
              gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                --verify-tag --draft --title "HackDesk $GITHUB_REF_NAME" --notes "" ;;
            "true false") ;; # Only unpublished drafts can replace assets on a retry.
            *) echo "::error::Expected an unpublished draft release, received: $state"; exit 1 ;;
          esac
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          names="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          diff <(printf '%s\n' "${assets[@]#artifacts/}" | sort) <(printf '%s\n' "$names" | sort)
          valid="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets | all(.size > 0 and .state == "uploaded")')"
          test "$valid" = "true"
      - name: Extract release notes
        id: release-notes
        run: node scripts/release-notes.ts
      - name: Publish prerelease
        if: ${{ contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ steps.release-notes.outputs.release_body }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --title "HackDesk $GITHUB_REF_NAME" --notes "$RELEASE_NOTES"
      - name: Publish stable release
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ steps.release-notes.outputs.release_body }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest --title "HackDesk $GITHUB_REF_NAME" --notes "$RELEASE_NOTES"
      - name: Verify published release state
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          expected_prerelease="false"
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            expected_prerelease="true"
          fi

          state="$(gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')"
          if [[ "$state" != "false $expected_prerelease" ]]; then
            echo "::error::Unexpected published release state: $state"
            exit 1
          fi
